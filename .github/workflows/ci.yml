name: Windows simulator and regression tests

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -V
      - name: Run 950 simulations and prepare portable package
        shell: pwsh
        run: |
          build/Release/pinceszellozteto.exe --batch --config config/baseline.ini --out package/simulation-output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build/Release/pinceszellozteto.exe package/
          Copy-Item build/Release/pince-kijelzo.exe package/
          Copy-Item tools/windows-display.cmd package/START.cmd
          Copy-Item tools/windows-launch.cmd package/BATCH.cmd
          Copy-Item docs/windows_quickstart.md package/README.md
          Copy-Item config package/config -Recurse
          Copy-Item docs package/docs -Recurse
          Copy-Item build/display-preview.png package/display-preview.png
      - name: Independent water and energy audit
        run: python tools/audit_batch.py package/simulation-output/sensitivity-summary.csv
      - name: Dashboard logic smoke test (mock DOM)
        run: node tools/dashboard_smoke_test.cjs package/simulation-output/report.html 6
      - name: Windows CLI and Unicode paths
        run: python tools/test_cli.py build/Release/pinceszellozteto.exe
      - uses: actions/upload-artifact@v4
        with:
          name: pinceszellozteto-windows-x64
          path: package/
          if-no-files-found: error
